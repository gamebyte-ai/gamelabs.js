name: Release

# Publishes @gamebyte/gamelabsjs to npm when a v* tag is pushed (git tag v4.2.1 && git push origin v4.2.1).
# Auth is npm trusted publishing: the job's GitHub OIDC token is exchanged for a one-time publish credential,
# so no npm token exists anywhere. npm attaches provenance automatically (public repo + public package).
# Requirements from https://docs.npmjs.com/trusted-publishers: a GitHub-hosted runner, `id-token: write`,
# npm CLI >= 11.5.1 (Node 24 ships 11.x), package.json repository.url equal to this repo, and a Trusted
# Publisher on npmjs.com naming this repo and this file name ("release.yml").

on:
  push:
    tags: ['v*']

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Full history and every branch, so the next step can see origin/main.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No dependency cache: npm's trusted-publishing guide says never to cache in a release build.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Only reviewed code publishes: the tagged commit must already be merged to main.
      - name: Tagged commit is on main
        run: node scripts/release-guard.mjs main-ancestor

      - name: Tag matches package.json version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      - name: npm supports trusted publishing
        run: node scripts/release-guard.mjs npm-version

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # `prepare` builds dist/ before packing.
      - name: Publish
        run: npm publish --access public
