<h1 id="overview">Gamelabs.js</h1>
<p>A TypeScript skeleton + reusable modules for web games — designed for AI-generated projects, consistent structure, and strict rendering/logic separation.</p>

<p>Built on <strong>Three.js</strong> (3D world/scene), <strong>PixiJS</strong> (2D HUD/UI), and <strong>GSAP</strong> (animations).</p>
